name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Package
        run: |
          APP_NAME="HWPPreview"
          SCHEME="HWPPreview"

          # 1. Archive without Developer ID signing.
          xcodebuild archive \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -archivePath "build/${APP_NAME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          # 2. Extract .app
          mkdir -p "dist"
          cp -R "build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app" "dist/${APP_NAME}.app"

          # 3. Best-effort ad-hoc signing for account-free distribution.
          APP_PATH="dist/${APP_NAME}.app"
          APPEX_PATH="${APP_PATH}/Contents/PlugIns/HWPQuickLookPreview.appex"

          if [ ! -d "${APPEX_PATH}" ]; then
            echo "Missing Quick Look extension: ${APPEX_PATH}"
            exit 1
          fi

          codesign --force --sign - --timestamp=none "${APPEX_PATH}"
          codesign --force --sign - --timestamp=none "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign -dv --verbose=4 "${APP_PATH}"
          codesign -dv --verbose=4 "${APPEX_PATH}"

          # 4. Zip while preserving the app bundle parent directory.
          cd dist
          ditto -c -k --keepParent "${APP_NAME}.app" "../${APP_NAME}.zip"
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: HWPPreview.zip
          body: |
            ## HWP Preview ${{ github.ref_name }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
